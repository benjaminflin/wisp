<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';"
    />
    <title>Wisp</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      .shell {
        display: flex;
        align-items: center;
        gap: 11px;
        height: 100%;
        padding: 0 16px;
        border-radius: 16px;
        background: rgba(22, 23, 27, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.42);
        backdrop-filter: blur(18px) saturate(150%);
        color: #eceef2;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 140ms ease, transform 140ms ease;
      }
      .shell.on {
        opacity: 1;
        transform: translateY(0);
      }
      .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        flex: none;
        background: #6b7280;
      }
      .dot.recording {
        background: #f2a03d;
        animation: pulse 1.15s ease-in-out infinite;
      }
      .dot.transcribing {
        background: #e8c15a;
        animation: pulse 0.5s ease-in-out infinite;
      }
      .dot.error {
        background: #e2705f;
      }
      .dot.done {
        background: #4ec98a;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.4;
          transform: scale(0.82);
        }
      }
      .body {
        flex: 1;
        min-width: 0;
      }
      .label {
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sub {
        margin-top: 1px;
        font-size: 10.5px;
        color: #9aa0ad;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-height: 13px;
      }
      .meter {
        margin-top: 5px;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      .fill {
        height: 100%;
        width: 0%;
        border-radius: 2px;
        background: linear-gradient(90deg, #4ec98a, #f2a03d);
        transition: width 60ms linear;
      }
    </style>
  </head>
  <body>
    <div class="shell" id="shell">
      <span class="dot" id="dot"></span>
      <div class="body">
        <div class="label" id="label">Ready</div>
        <div class="sub" id="sub"></div>
        <div class="meter"><div class="fill" id="fill"></div></div>
      </div>
    </div>
    <script>
      const shell = document.getElementById('shell');
      const dot = document.getElementById('dot');
      const label = document.getElementById('label');
      const sub = document.getElementById('sub');
      const fill = document.getElementById('fill');

      let phase = 'idle';

      function renderSnapshot(state) {
        phase = state.phase;
        dot.className = `dot ${phase === 'recording' ? 'recording' : phase === 'transcribing' ? 'transcribing' : phase === 'error' ? 'error' : 'done'}`;

        if (phase === 'recording') {
          label.textContent = state.latchArmed ? 'Listening — latched' : 'Listening…';
          sub.textContent = state.latchArmed ? 'Tap the key again to stop' : 'Release to transcribe';
        } else if (phase === 'transcribing') {
          label.textContent = 'Transcribing…';
          sub.textContent = 'Whisper is working';
        } else if (phase === 'error') {
          label.textContent = 'Problem';
          sub.textContent = state.hint || '';
        } else {
          const last = state.lastResult;
          if (last && last.text) {
            label.textContent = last.pasted
              ? 'Pasted'
              : last.copied === false
                ? 'Clipboard blocked'
                : 'Copied to clipboard';
            sub.textContent = last.text.length > 42 ? `${last.text.slice(0, 42)}…` : last.text;
          } else if (last) {
            label.textContent = 'Nothing heard';
            sub.textContent = 'Check your input device';
          } else {
            label.textContent = 'Ready';
            sub.textContent = '';
          }
        }

        if (phase !== 'recording') fill.style.width = phase === 'transcribing' ? '100%' : '0%';
        shell.classList.add('on');
      }

      window.wisp.onEvent((event) => {
        if (event.type === 'level') {
          if (phase === 'recording') {
            fill.style.width = `${Math.min(100, Math.round(Math.sqrt(event.rms) * 260))}%`;
          }
          return;
        }
        if (event.type === 'state') renderSnapshot(event.state);
      });

      // The window is shown only after a state push, so start hidden.
      shell.classList.remove('on');
    </script>
  </body>
</html>
